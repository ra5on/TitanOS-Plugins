# Disposable Debian root for building the driver plugins (scripts/make-driver-plugins.py).
# The kernel headers and linux-source packages are added on the command line,
# pinned to the exact version of the image's kernel.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main

[Build]
# trixie-backports as a source for the headers (and linux-source) of the
# newer kernel (kernel choice "Neu"). Backports has a low apt priority, and
# the kernel packages are requested with their exact version, so the Debian
# kernel still gets its packages from trixie.
SandboxTrees=sandbox

[Output]
Format=directory
Output=root

[Content]
Bootable=no
WithDocs=yes
Packages=build-essential
         libelf-dev
         kmod
         dwarves
         xz-utils
         python3
